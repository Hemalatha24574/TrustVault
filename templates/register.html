{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-7 col-lg-6"><div class="card p-4 p-md-5"><h2>Create account</h2><p class="muted">Use the same company name as teammates to share documents.</p><form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Company name</label><input class="form-control mb-3" name="company" required><label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-4" type="password" name="password" minlength="8" required><button class="btn btn-primary w-100">Register</button></form><p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div></div>{% endblock %}
