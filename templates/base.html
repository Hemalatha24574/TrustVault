<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustVault</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f7fb;color:#172033}.navbar{background:#14213d}.brand{font-weight:800;letter-spacing:.5px}.card{border:0;border-radius:16px;box-shadow:0 6px 22px #15274a12}.btn-primary{background:#3156a6;border:0}.muted{color:#69758a}.hash{font-family:monospace;font-size:.75rem;overflow-wrap:anywhere}</style></head>
<body><nav class="navbar navbar-dark mb-4"><div class="container"><a class="navbar-brand brand" href="{{ url_for('dashboard') if current_user else url_for('login') }}">🔐 TrustVault</a>
{% if current_user %}<span class="text-white small">{{ current_user }} · {{ current_role }}</span><a class="btn btn-sm btn-outline-light" href="{{ url_for('logout') }}">Log out</a>{% endif %}</div></nav>
<main class="container pb-5">{% with messages=get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="alert alert-info">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
<footer class="text-center muted small py-4">TrustVault · Secure document sharing demo</footer></body></html>
